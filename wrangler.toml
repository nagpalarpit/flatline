name = "flatline"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Stores users, monitored checks, status history, and registration attempts.
[[d1_databases]]
binding = "DB"
database_name = "flatline-db"
database_id = "placeholder-set-after-wrangler-d1-create"

# Sweeps for overdue checks every minute — this is the primary write-heavy
# path (see docs/fullstack/2026-08-25-flatline-v1-implementation.md for why
# writes are concentrated here instead of on every inbound ping).
[triggers]
crons = ["* * * * *"]

[vars]
ENVIRONMENT = "development"
# No secrets required for v1 — alerting is outbound webhook-only (customer
# supplies their own URL), so there is no third-party credential dependency
# to provision before this can run end to end, unlike email/SMS alerting.

# wrangler does not inherit top-level bindings into named environments —
# omitting these here deploys a Worker with env.DB undefined, crashing
# every DB-touching route (confirmed via `wrangler deploy --dry-run`).
# Staging shares the production D1 database for now since no separate
# staging DB has been provisioned.
[env.staging]
name = "flatline-staging"
[env.staging.vars]
ENVIRONMENT = "staging"
[[env.staging.d1_databases]]
binding = "DB"
database_name = "flatline-db"
database_id = "placeholder-set-after-wrangler-d1-create"

[env.production]
name = "flatline"
[env.production.vars]
ENVIRONMENT = "production"
[[env.production.d1_databases]]
binding = "DB"
database_name = "flatline-db"
database_id = "placeholder-set-after-wrangler-d1-create"
